services:
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      POSTGRES_DB: argent
      POSTGRES_USER: argent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-argent}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argent"]
      interval: 5s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-argent}
    command: ["sh", "-c", "exec redis-server --requirepass \"$${REDIS_PASSWORD}\""]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 8

  rabbitmq:
    image: rabbitmq:3.13-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: argent
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-argent}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 8

  prometheus:
    image: prom/prometheus:v2.54.1@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0@sha256:408afb9726de5122b00a2576763a8a57a3c86d5b0eff5305bc994ceb3eb96c3f
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: argent
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-argent}
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro

  gateway:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      ARGENT_ENV: ${ARGENT_ENV:-dev}
      ARGENT_CORS_HOSTS: ${ARGENT_CORS_HOSTS:-}
      ARGENT_BIND_HOST: 0.0.0.0
      PORT: 8080
      JDBC_URL: jdbc:postgresql://postgres:5432/argent
      DB_USER: argent
      DB_PASS: ${POSTGRES_PASSWORD:-argent}
      REDIS_URL: redis://:${REDIS_PASSWORD:-argent}@redis:6379
      RABBITMQ_URL: amqp://argent:${RABBITMQ_PASSWORD:-argent}@rabbitmq:5672
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-argent}
      JWT_SECRET: ${JWT_SECRET:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      OBSERVABILITY_TOKEN: ${OBSERVABILITY_TOKEN:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      PUBLIC_SIGNUP_ENABLED: ${PUBLIC_SIGNUP_ENABLED:-false}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
      GOOGLE_DESKTOP_CLIENT_ID: ${GOOGLE_DESKTOP_CLIENT_ID:-}
      SEED_MARKET_MAKER: ${SEED_MARKET_MAKER:-true}
      SEED_DEMO_FUNDS: ${SEED_DEMO_FUNDS:-true}
      MARKET_DATA_MODE: ${MARKET_DATA_MODE:-BINANCE_PUBLIC}
      MARKET_SIMULATION_SEED: ${MARKET_SIMULATION_SEED:-10645015}
      ISTFIN_API_KEY: ${ISTFIN_API_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      BINANCE_SPOT_TESTNET_API_KEY: ${BINANCE_SPOT_TESTNET_API_KEY:-}
      BINANCE_SPOT_TESTNET_SECRET: ${BINANCE_SPOT_TESTNET_SECRET:-}
      MARKET_MAKER_PASSWORD: ${MARKET_MAKER_PASSWORD:-}
      MM_MAX_QUOTE_NOTIONAL: ${MM_MAX_QUOTE_NOTIONAL:-5000}
      MM_MAX_INVENTORY_NOTIONAL: ${MM_MAX_INVENTORY_NOTIONAL:-10000000}
      ARGENT_AI_API_KEY: ${ARGENT_AI_API_KEY:-}
      ARGENT_AI_BASE_URL: ${ARGENT_AI_BASE_URL:-https://api.groq.com/openai/v1}
      ARGENT_AI_MODEL: ${ARGENT_AI_MODEL:-openai/gpt-oss-20b}
      ARGENT_AI_BALANCE_CHANGE_ALERT_PCT: ${ARGENT_AI_BALANCE_CHANGE_ALERT_PCT:-10}
      ARGENT_AI_CONCENTRATION_ALERT_PCT: ${ARGENT_AI_CONCENTRATION_ALERT_PCT:-80}
    ports:
      - "${ARGENT_PUBLISH_HOST:-127.0.0.1}:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
